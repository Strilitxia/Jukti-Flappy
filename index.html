<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Orange</title>
  <style>
    /* Retro darkweb theme */
    @keyframes bgPulse {
      from { background-color: #000; }
      to   { background-color: #050005; }
    }
    @keyframes scanline {
      0% { background-position: 0 0; }
      100% { background-position: 0 4px; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }
    @keyframes rise {
      from { transform: translateY(100vh); }
      to   { transform: translateY(-10px); }
    }
    
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      color: rgb(253, 135, 0);
      animation: bgPulse 5s infinite alternate;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* Prevent pull-to-refresh on mobile */
      overscroll-behavior: none; 
    }

    canvas {
      display: block;
      background: #000000;
      border: 4px solid rgb(255, 123, 0);
      box-shadow: 0 0 20px rgb(255, 195, 65);
      z-index: 5;
      position: relative;
      margin-top: 5vh;
      border-radius: 8px;

      /* --- RESPONSIVE CSS --- */
      width: 95vw;             /* Takes up 95% of the screen width on small devices */
      max-width: 320px;        /* Prevents getting too massive on Desktop */
      height: auto;            /* Scales height automatically... */
      aspect-ratio: 2 / 3;     /* ...while maintaining the strict 320x480 internal ratio */
      touch-action: none;      /* Disables browser touch actions like zooming/panning */
    }

    .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(
              transparent 0 2px,
              rgba(177, 146, 89, 0.2) 2px 4px
      );
      pointer-events: none;
      animation: scanline 0.1s steps(1) infinite;
      z-index: 10;
    }

    /* Responsive text formatting */
    #msg, #instruction, #gameOverText, #restartHint {
      text-align: center;
      margin: 10px 0;
      position: relative;
      z-index: 11;
      line-height: 1.4;
      max-width: 90vw; /* Keeps text inside screen bounds */
      padding: 0 10px;
    }

    #msg { 
      font-size: clamp(1rem, 5vw, 1.2rem); 
      animation: blink 1s step-end infinite; 
    }
    #instruction { 
      font-size: clamp(0.85rem, 4vw, 1rem); 
      color: #aaa; 
      animation: none; 
    }
    #gameOverText, #restartHint { 
      display: none; 
      color: red; 
      font-size: clamp(1rem, 5vw, 1.1rem); 
    }

    .spooky {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .spooky .particle {
      position: absolute;
      bottom: -5px;
      background: rgba(2, 255, 255, 0.6);
      border-radius: 50%;
      animation-name: rise;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }
  </style>
</head>
<body>
<!-- Spooky ambient particles floating -->
<div class="spooky" id="spooky"></div>

<!-- Internal resolution stays fixed, only the CSS scales it -->
<canvas id="gameCanvas" width="320" height="480"></canvas>
<div class="overlay"></div>
<div id="msg"></div>
<div id="instruction"></div>
<div id="gameOverText">💀 GAME OVER 💀</div>
<div id="restartHint">Tap to Restart</div>

<script>
  // Generate spooky particles
  const spookyContainer = document.getElementById('spooky');
  const particleCount = 40;
  for (let i = 0; i < particleCount; i++) {
    const p = document.createElement('div');
    p.classList.add('particle');
    const size = Math.random() * 6 + 4;
    const left = Math.random() * 100;
    const duration = Math.random() * 10 + 5;
    const delay = Math.random() * -15;
    p.style.width = `${size}px`;
    p.style.height = `${size}px`;
    p.style.left = `${left}vw`;
    p.style.animationDuration = `${duration}s`;
    p.style.animationDelay = `${delay}s`;
    spookyContainer.appendChild(p);
  }

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const msg = document.getElementById('msg');
  const instruction = document.getElementById('instruction');
  const gameOverText = document.getElementById('gameOverText');
  const restartHint = document.getElementById('restartHint');

  // Game Physics & Config
  const GRAVITY = 900;      // px/s²
  const FLAP = -400;        // px/s impulse
  const MOBILE_FLAP_FACTOR = 0.87; // 80% flap on touch
  const MAX_ATTEMPTS = 3;   // Maximum allowed tries for the Main Game
  const WIN_SCORE = 140;    // Score required to win

  // Game State Variables
  let birdY = 150, birdV = 0;
  let pipes = [], score = 0;
  let lastTime = null;
  let restartReady = false;
  let attemptsLeft = MAX_ATTEMPTS;

  // State Machine: 'DEMO_START', 'DEMO_PLAY', 'DEMO_OVER', 'MAIN_START', 'MAIN_PLAY', 'MAIN_OVER', 'LOCKED', 'WON'
  let gameState = 'DEMO_START';

  function resetGameVars() {
    birdY = 150; birdV = 0; pipes = [];
    score = 0; lastTime = null;
    restartReady = false;
    createPipe();
  }

  function initDemo() {
    resetGameVars();
    gameState = 'DEMO_START';
    msg.innerHTML = "DEMO MODE<br>Tap to Flap!";
    msg.style.display = 'block';
    instruction.innerHTML = "Practice mode. Get a feel for the gravity! Score will not be counted";
    instruction.style.display = 'block';
    gameOverText.style.display = 'none';
    restartHint.style.display = 'none';
  }

  function startMainGameCheck() {
    // Check cache for attempts
    let storedAttempts = localStorage.getItem('juktiFlappyAttempts');
    if (storedAttempts === null) {
      attemptsLeft = MAX_ATTEMPTS;
      localStorage.setItem('juktiFlappyAttempts', attemptsLeft);
    } else {
      attemptsLeft = parseInt(storedAttempts);
    }

    // Lockout if out of attempts
    if (attemptsLeft <= 0) {
      gameState = 'LOCKED';
      resetGameVars();
      gameOverText.innerHTML = "🔒 LOCKED 🔒";
      gameOverText.style.display = 'block';
      restartHint.innerHTML = "You have used all your attempts! Better luck next time.";
      restartHint.style.display = 'block';
      msg.style.display = 'none';
      instruction.style.display = 'none';
      return;
    }

    resetGameVars();
    gameState = 'MAIN_START';
    msg.innerHTML = `MAIN GAME<br>Attempts left: ${attemptsLeft}<br>Tap to Start!`;
    msg.style.display = 'block';
    instruction.innerHTML = `Score ${WIN_SCORE} to win the challenge!`;
    instruction.style.display = 'block';
    gameOverText.style.display = 'none';
    restartHint.style.display = 'none';
  }

  function createPipe() {
    const topHeight = Math.random() * 180 + 80;
    const gap = 120;
    pipes.push({ x: 320, top: topHeight, bottom: topHeight + gap });
  }

  function updatePipes(dt) {
    pipes.forEach(pipe => pipe.x -= 100 * dt);
    if (pipes.length && pipes[0].x < -30) pipes.shift();
    if (!pipes.length || pipes[pipes.length - 1].x < 200) createPipe();
  }

  function checkCollision() {
    if (birdY < 0 || birdY > canvas.height) return true;
    return pipes.some(pipe =>
            pipe.x < 60 && pipe.x + 30 > 40 &&
            (birdY < pipe.top || birdY > pipe.bottom)
    );
  }

  function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    // Cap delta time to make animations smoothly survive tab-switching
    if (dt > 0.1) dt = 0.1;

    if (gameState === 'DEMO_PLAY' || gameState === 'MAIN_PLAY') {
      birdV += GRAVITY * dt;
      birdY += birdV * dt;
      updatePipes(dt);

      if (checkCollision()) {
        // Crash Logic Check
        if (gameState === 'DEMO_PLAY') {
          gameState = 'DEMO_OVER';
          localStorage.setItem('juktiFlappyDemoPlayed', 'true'); // Save that demo is done
          gameOverText.innerHTML = "DEMO FINISHED";
          restartHint.innerHTML = "Tap to begin Main Game";
        } else {
          gameState = 'MAIN_OVER';
          gameOverText.innerHTML = "💀 GAME OVER 💀";
          restartHint.innerHTML = `Tap to Restart`;
        }
        gameOverText.style.display = 'block';
        restartHint.style.display = 'block';
        setTimeout(() => restartReady = true, 800); // Prevent accidental double-taps
      } else {
        score += dt * 10;

        // Win condition (140 score) only applies in Main Game
        if (gameState === 'MAIN_PLAY' && score >= WIN_SCORE) {
          gameState = 'WON';
          window.location.href = 'congo.html';
        }
      }
    }

    // draw
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawPipes();
    drawBird();

    // Draw UI Score
    ctx.fillStyle = '#f0b373';
    ctx.font = '16px Courier New';
    if (gameState.includes('DEMO')) {
      ctx.fillText(`Demo Score: ${Math.floor(score)}`, 10, 20);
    } else if (gameState.includes('MAIN')) {
      ctx.fillText(`Score: ${Math.floor(score)} / ${WIN_SCORE}`, 10, 20);
    }

    requestAnimationFrame(gameLoop);
  }

  function drawPipes() {
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#f0b373';
    pipes.forEach(pipe => {
      const alpha = 0.7 + Math.random() * 0.3;
      ctx.fillStyle = `rgba(255,114,0,${alpha})`;
      ctx.fillRect(pipe.x, 0, 30, pipe.top);
      ctx.fillRect(pipe.x, pipe.bottom, 30, canvas.height - pipe.bottom);
    });
    ctx.shadowBlur = 0;
  }

  const birdImg = new Image();
  birdImg.src = 'https://static0.polygonimages.com/wordpress/wp-content/uploads/2025/12/frieren-looking-up-in-the-trailer-for-season-2.jpg?w=600&h=600&fit=crop';
  function drawBird() {
    const angle = Math.max(Math.min(birdV / 300, 0.5), -0.5);
    ctx.save();
    ctx.translate(50, birdY);
    ctx.rotate(angle);
    if (birdImg.complete) {
      ctx.drawImage(birdImg, -10, -10, 20, 20);
    } else {
      ctx.fillStyle = `rgba(255, 0, 255, ${0.8 + Math.random()*0.2})`;
      ctx.fillRect(-10, -10, 20, 20);
    }
    ctx.restore();
  }

  function flap(isTouch) {
    const impulse = FLAP * (isTouch ? MOBILE_FLAP_FACTOR : 1);
    birdV = impulse;
  }

  function handleTap(isTouch) {
    if (gameState === 'LOCKED' || gameState === 'WON') return;

    if (gameState === 'DEMO_START') {
      gameState = 'DEMO_PLAY';
      msg.style.display = 'none';
      instruction.style.display = 'none';
      flap(isTouch);
    } else if (gameState === 'DEMO_PLAY') {
      flap(isTouch);
    } else if (gameState === 'DEMO_OVER' && restartReady) {
      startMainGameCheck();
    } else if (gameState === 'MAIN_START') {
      // Deduct Attempt on Main Game Start and Save to Local Cache
      attemptsLeft--;
      localStorage.setItem('juktiFlappyAttempts', attemptsLeft);

      gameState = 'MAIN_PLAY';
      msg.style.display = 'none';
      instruction.style.display = 'none';
      flap(isTouch);
    } else if (gameState === 'MAIN_PLAY') {
      flap(isTouch);
    } else if (gameState === 'MAIN_OVER' && restartReady) {
      startMainGameCheck();
    }
  }

  // Changed to listen to `document` so users can tap ANYWHERE on the screen (great for mobile)
  document.addEventListener('mousedown', () => handleTap(false));
  document.addEventListener('touchstart', e => {
    // Only prevent default if they are tapping directly on the canvas to stop scrolling
    if (e.target === canvas) {
      e.preventDefault();
    }
    handleTap(true);
  }, { passive: false });

  // Initialize logic
  let demoPlayed = localStorage.getItem('juktiFlappyDemoPlayed') === 'true';
  if (!demoPlayed) {
    initDemo();
  } else {
    startMainGameCheck();
  }
  requestAnimationFrame(gameLoop);
</script>
</body>
</html>
